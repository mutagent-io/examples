name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default to read-only. Jobs that need more must opt in explicitly.
permissions:
  contents: read

jobs:
  sweep:
    name: Leak sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify no internal references leaked
        run: node scripts/public-scrub/sweep.mjs .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history as well as the tree; it needs the full clone.
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
