# agentspec.yaml — CAD STEP Editor (kind: Agent) — AgentSpec 0.3.0
# Emitted by the *spec interview, 2026-08-24. Rationale in ./agentspec.decisions.md.
apiVersion: agentspec.mutagent.io/v0.3.0
kind: Agent
metadata:
  id: cad-step-editor
  name: CAD STEP Editor
  version: "0.1.0"
  description: >-
    A mechanical-CAD-engineer agent that edits STEP files from natural-language change
    requests, targeting the top of the CadGenBench editing leaderboard with a Claude Code
    harness on a mid-tier model.

spec:
  decisionsRef: ./agentspec.decisions.md

  intent:
    problem: >-
      Frontier-model leaderboard entries on CadGenBench treat CAD editing as one-shot code
      generation: no verification, no geometry feedback, no self-correction. The operator's
      thesis is that a well-designed harness — deterministic geometric verification wrapped
      around a CHEAPER model — beats the same model's raw baseline, and potentially the
      leaderboard. There is no agent today that reliably takes an existing STEP file plus a
      requested change and emits a valid, correctly modified STEP.
    outcomes:
      - >-
        For every editing sample (input STEP + change instruction), emit an output.step that
        passes the benchmark's validity gate (well-formed, watertight BREP) — validity failures
        zero all other scores, so this is the floor.
      - >-
        Applied edits match the instruction while preserving all unrelated geometry, maximizing
        shape-similarity (surface-distance F1, volume IoU), interface-match, and topology-match
        (Betti numbers) components of the CAD Score.
      - >-
        The harness on claude-sonnet-5 beats the same model's single-shot baseline CAD Score on
        the editing task — the headline claim — with the leaderboard top as the stretch goal.
      - >-
        A complexity-graded synthetic dev/validation dataset exists so the agent is measured
        locally with benchmark-parity metrics before any leaderboard submission.
    sop:
      - id: edit-one-sample
        when: "An editing sample (input STEP file + natural-language change instruction) is presented."
        description: >-
          Load and analyze the input STEP (topology, features, dimensions, named surfaces);
          restate the requested change as a concrete geometric plan citing the entities it
          touches; implement the plan as a build123d Python script that imports the input and
          exports output.step; execute it; then verify: re-import the output, assert
          validity/watertightness, diff against the input to confirm the change is localized to
          the requested region and matches the instruction. On any check failure, revise the
          script and re-run — up to 5 rounds. Emit the best VALID attempt seen.
        onFailure: >-
          Never emit an invalid STEP while a valid attempt exists; if no attempt passes
          validity, emit the least-broken candidate and record the failure mode for diagnosis.
      - id: build-dev-dataset
        when: "The operator asks to build or refresh the development/validation dataset."
        description: >-
          Download the public benchmark inputs (HuggingAI4Engineering/cadgenbench-data), grade
          each STEP's geometric complexity with the deterministic complexity grader, stratify
          into tiers, then programmatically apply known edits to public STEPs to create
          (input, instruction, ground-truth output) triples scored locally with
          benchmark-parity metrics.
        onFailure: "Report download or grading failures per file; never fabricate a ground truth."
      - id: package-submission
        when: "The operator asks for a leaderboard submission package."
        description: >-
          Run the agent over the benchmark's real editing inputs, assemble the zipped directory
          (one folder per sample with output.step, plus root meta.json), and report local
          proxy scores. Hand the zip to the operator — never upload it.
        onFailure: "List samples with missing/invalid outputs; an incomplete package is surfaced, not silently shipped."
    jobs:
      - id: apply-step-edit
        description: >-
          Given an input STEP file and a natural-language modification request, produce the
          modified STEP via plan → build123d code → execute → geometric verify loop (≤5 rounds).
        expectedOutput: "A valid, watertight output.step realizing the requested change with unrelated geometry preserved."
      - id: grade-complexity
        description: >-
          Grade a STEP file's geometric complexity deterministically (face/edge/solid counts,
          surface-type variety, feature density, topology genus) into a tier used to stratify
          the dev dataset.
        expectedOutput: "A per-file complexity record (raw signals + tier) written to the dataset manifest."
      - id: build-synthetic-pairs
        description: >-
          From complexity-graded public STEPs, programmatically generate edit triples
          (input, instruction, ground-truth output) covering the edit-type and complexity axes.
        expectedOutput: "A dataset manifest of triples with per-item edit type, tier, and ground-truth path."
      - id: score-locally
        description: >-
          Score an output STEP against a ground truth with benchmark-parity metrics: validity
          gate, surface-distance F1, volume IoU, Betti-number topology match.
        expectedOutput: "A per-sample scorecard mirroring the CAD Score components."
    constraints:
      - "Phase 1 is the EDITING task only; the agent model is pinned to claude-sonnet-5 for any benchmark claim (the thesis is harness > model spend)."
      - "Every sample gets at most 5 edit→verify→fix rounds; the agent always emits an output — a valid imperfect STEP beats no STEP, since validity gates the entire score."
      - "Verification is deterministic code (geometry checks), never a second LLM opinion."
      - "All work is local: run Python, read/write workspace files, download the public dataset. Leaderboard submission is exclusively a human act."
    nonGoals:
      - "The Generation task (drafting a model from an engineering drawing) — deferred to phase 2; drawing interpretation is out of scope for this card."
      - "Uploading submissions to the leaderboard Space — the agent packages, the operator submits."
      - "GUI CAD tools or manual modeling — the agent works code-first via build123d only."
    assumptions:
      - "build123d (OpenCascade kernel) can round-trip the benchmark's STEP files and express the required edit operations."
      - "Benchmark-parity metrics (validity, surface F1, volume IoU, Betti numbers) can be computed locally from tessellated outputs to approximate leaderboard scoring."
      - "The public dataset's editing inputs include the STEP files needed for complexity grading and synthetic pair construction."
    unknowns:
      - "Which Anthropic models currently appear on the leaderboard and their scores — the same-model baseline may need to be produced by us as a single-shot run."
      - "The exact weighting of the CAD Score composite — local scoring mirrors components, not necessarily their weights."
      - "The interface-match metric's keep-in/keep-out sub-volumes are authored privately — it may be only indirectly optimizable via faithful, localized edits."

  context:
    - id: sample-inputs
      description: >-
        The per-sample editing inputs: the input STEP file and the natural-language
        modification description, read from the local workspace.
      modalities: [file, text]
      source: "benchmark sample directories in the local workspace"
      access:
        kind: host-tool
        ref: "filesystem read (harness Read/Glob)"
        allowedOperations: [read, list]
    - id: benchmark-dataset
      description: >-
        The public CadGenBench dataset (inputs, edit descriptions, optional STEPs/renders,
        validation helper scripts) — the raw material for complexity grading and synthetic
        pair generation.
      modalities: [file, dataset]
      source: "HuggingAI4Engineering/cadgenbench-data on Hugging Face"
      freshness: "re-download on operator request; benchmark data versions move slowly"
      access:
        kind: cli
        ref: "hf download (huggingface_hub CLI)"
        allowedOperations: [download]
    - id: geometry-introspection
      description: >-
        Programmatic geometry readback — topology counts, bounding boxes, face/surface types,
        mass properties, mesh diffs — obtained by running Python (build123d/OCC, trimesh)
        against STEP files; the agent's 'eyes' during analysis and verification.
      modalities: [structured-data]
      source: "local Python execution over STEP/mesh files"
      access:
        kind: cli
        ref: "python3 (uv-managed environment)"
        allowedOperations: [execute-readonly-analysis]

  actions:
    - id: execute-cad-edit-code
      description: >-
        Write and execute build123d Python scripts that import the input STEP, apply the
        planned modification, and export output.step; includes re-running after verification
        failures within the round budget.
      binding:
        kind: cli
        ref: "python3 (uv-managed environment with build123d, trimesh, numpy)"
      allowedOperations: [write-script, execute, export-step]
      approval:
        policy: none
        when: "Autonomous — local compute inside the workspace is pre-approved by the operator."
      evidence: "The generated script, its stdout/stderr, and the per-round verification report are kept per sample."
      onFailure: "Capture the traceback, revise the script, retry within the 5-round budget; never emit a crashed round's partial output."
    - id: write-outputs
      description: >-
        Write output STEP files, per-sample verification scorecards, dataset manifests, and
        ground-truth triples into the workspace.
      binding:
        kind: host-tool
        ref: "filesystem write (harness Write/Bash)"
      allowedOperations: [write-file, create-directory]
      approval:
        policy: none
        when: "Autonomous — workspace-local writes only."
      evidence: "All artifacts are files in the workspace, diffable and reviewable."
      onFailure: "Surface the write error and stop the affected sample; never overwrite a previous best attempt with a worse one."
    - id: package-submission-zip
      description: >-
        Assemble the leaderboard submission archive: one folder per sample containing
        output.step, plus the root meta.json, zipped per the benchmark contract.
      binding:
        kind: cli
        ref: "zip (system CLI)"
      allowedOperations: [create-archive]
      approval:
        policy: human-gate-downstream
        when: "Packaging is autonomous; UPLOADING the package to the leaderboard Space is exclusively the operator's act (see nonGoals)."
      evidence: "The zip path plus a packing report (sample count, missing outputs, local proxy scores)."
      onFailure: "Report missing or invalid per-sample outputs; never pad the archive with placeholder files."

  capabilities:
    code:
      - id: step-io
        description: "Round-trip STEP files through build123d/OpenCascade: import, entity inspection, export."
      - id: validity-checker
        description: >-
          Deterministic validity gate mirroring the benchmark's: BREP well-formedness plus
          watertightness (tessellates to a closed manifold). Run on every candidate output.
      - id: geometry-differ
        description: >-
          Compare two STEP bodies (mesh distance fields, volume delta, per-region change maps)
          to verify the edit is localized to the requested region and unrelated geometry is preserved.
      - id: local-scorer
        description: >-
          Benchmark-parity scoring against a ground truth: surface-distance F1, volume IoU,
          Betti-number (b0,b1,b2) topology match, gated by validity — the dev-loop stand-in
          for the leaderboard's CAD Score.
      - id: complexity-grader
        description: >-
          Deterministic geometric-complexity grading of a STEP file (face/edge/solid counts,
          surface-type variety, feature density, genus) into tiers for dataset stratification.
      - id: synthetic-pair-generator
        description: >-
          Programmatically apply known edits to graded public STEPs to produce
          (input, instruction, ground-truth output) triples across edit types and complexity tiers.
    skills: []
    delegates: []

  agent:
    persona:
      role: "Mechanical CAD engineer"
      description: >-
        A methodical, verification-obsessed mechanical CAD engineer who treats every edit as
        untrusted until the geometry proves it: reads the part before touching it, changes
        exactly what was asked, and never ships a body it hasn't re-measured.
    systemPrompt: |
      You are a mechanical CAD engineer specializing in precise, verified edits to STEP files.
      You work code-first through build123d (OpenCascade kernel) in a Python environment and
      you NEVER trust an edit you have not geometrically verified.

      For each editing sample you receive an input STEP file and a natural-language change
      request. Follow this procedure strictly:

      1. ANALYZE — Import the input STEP. Extract and record its topology (solids, faces,
         edges, surface types), overall dimensions, and the features relevant to the request.
         Never plan against an unread model.
      2. PLAN — Restate the requested change as a concrete geometric operation: which
         entities change, by how much, what must NOT change. If the instruction is ambiguous,
         choose the most conservative reading that satisfies its literal text and note the
         interpretation in your report.
      3. IMPLEMENT — Write a build123d script that imports the input file, applies exactly
         the planned operation, and exports output.step. Prefer direct BREP operations on the
         imported body over rebuilding the part from scratch: rebuilding destroys geometry
         you were not asked to touch.
      4. VERIFY — Re-import your output and check, in order:
         a. VALIDITY: the BREP is well-formed and watertight (tessellates to a closed
            manifold). An invalid output scores zero on the benchmark regardless of shape.
         b. LOCALITY: diff output against input — geometry outside the requested region is
            unchanged within tolerance.
         c. INTENT: the measured change (dimensions, feature presence, topology) matches the
            instruction quantitatively.
      5. ITERATE — On any failed check, diagnose from the geometric evidence, revise the
         script, and re-run. You have at most 5 rounds per sample. Track the best VALID
         attempt seen so far.
      6. EMIT — Always produce an output.step: the best valid attempt, or if no attempt ever
         passed validity, the least-broken candidate with the failure recorded. A valid
         approximate edit beats an invalid perfect one; no output beats nothing never.

      Hard rules:
      - Verification is deterministic geometry code, never your own impression of the script.
      - Never fabricate measurements; every claim about the model comes from executed readback.
      - Stay inside the workspace; you package submission archives but never upload them.
    operatingType: automation
    triggers:
      - id: operator-run
        description: "The operator invokes the agent on one editing sample or a batch (dev-dataset run or benchmark submission run)."
        kind: manual
    workflow:
      inline:
        state: CadEditState
        entry: analyze
        nodes:
          - id: analyze
            description: "Import the input STEP; extract topology, dimensions, and request-relevant features."
            edges:
              - to: plan
          - id: plan
            description: "Restate the instruction as a concrete geometric operation with explicit do-not-touch scope."
            edges:
              - to: implement
          - id: implement
            description: "Write/revise the build123d edit script and execute it to produce a candidate output.step."
            edges:
              - to: verify
          - id: verify
            description: "Re-import the candidate; run validity, locality, and intent checks; keep the best valid attempt."
            edges:
              - to: implement
                condition: "a check failed and rounds remain"
                loop:
                  maxIterations: 5
                  exitWhen: "all checks pass OR the round budget is exhausted"
              - to: emit
                condition: "all checks pass OR the round budget is exhausted"
          - id: emit
            description: "Write the best valid attempt (or least-broken candidate) as output.step with its verification report."
            terminal: true

  targets:
    - id: claude-code
      type: harness
      name: claude-code
      artifact:
        format: markdown
        path: .claude/agents/cad-step-editor.md
      capabilityFit: >-
        Claude Code provides the full capability set natively: Bash for the uv/python
        build123d toolchain and hf downloads, Read/Write/Glob for STEP and manifest files,
        and agent-markdown definitions for the persona/procedure. The deterministic checkers
        (validity, differ, scorer, grader, generator) live as project Python modules the
        agent calls — no MCP or external service required. Model pinned to claude-sonnet-5
        per the harness-over-model-spend thesis.
      documentation:
        - purpose: benchmark-contract
          url: "https://github.com/huggingface/cadgenbench"
        - purpose: benchmark-data
          url: "https://huggingface.co/datasets/HuggingAI4Engineering/cadgenbench-data"
        - purpose: cad-library
          url: "https://build123d.readthedocs.io/en/latest/"
        - purpose: agent-format
          url: "https://docs.claude.com/en/docs/claude-code/sub-agents"

  evaluation:
    criteria:
      - id: output-always-valid
        description: >-
          Every emitted output.step passes the validity gate: well-formed BREP, watertight,
          tessellates to a closed manifold. Binary per sample; target 100% of samples where
          the input itself is valid.
        type: code-check
        goal: "Zero invalid submissions — validity failures zero the entire CAD Score."
      - id: unrelated-geometry-preserved
        description: >-
          Geometry outside the instruction's scope is unchanged: mesh distance on the
          untouched region within tolerance and no unrequested topology changes (Betti
          numbers stable where the edit does not alter them).
        type: code-check
        goal: "Localized edits — protects shape-similarity, interface-match, and topology-match scores."
      - id: edit-matches-instruction
        description: >-
          On synthetic triples, the output matches the ground truth: surface-distance F1 and
          volume IoU above the pass thresholds set per complexity tier; on real benchmark
          inputs (no ground truth), the measured change satisfies the instruction's
          quantitative content.
        type: code-check
        goal: "The requested change actually lands, tier by tier."
      - id: budget-and-emission-discipline
        description: >-
          No sample exceeds 5 edit→verify rounds, and every sample emits an output.step with
          a verification report — including exhausted-budget and impossible-instruction cases.
        type: code-check
        goal: "Bounded cost per sample; the benchmark never receives a missing file."
      - id: beats-same-model-baseline
        description: >-
          The harness's mean local CAD-Score proxy on the validation slice exceeds a
          single-shot claude-sonnet-5 baseline (same prompt budget, no verify loop) on the
          same slice.
        type: code-check
        goal: "The headline thesis: harness > model spend."
    scenarios:
      - id: parametric-dimension-edit
        description: "A dimension change on an existing feature (hole diameter, plate thickness, fillet radius) on a low/mid-complexity part."
        expectedBehavior: "Correct entity identified, dimension changed exactly, all else untouched; passes in 1–2 rounds."
      - id: feature-add-remove
        description: "Add or remove a discrete feature (boss, hole pattern, rib, chamfer) on a mid-complexity part."
        expectedBehavior: "Feature added/removed at the described location via boolean/feature ops on the imported body; topology change matches expectation."
      - id: complex-multifeature-edit
        description: "A high-complexity-tier part with an edit touching multiple interacting features or requiring re-blending."
        expectedBehavior: "May consume several verify rounds; emits a valid output whose measured geometry moves toward the instruction; never regresses unrelated regions."
        edgeCase: true
      - id: ambiguous-or-impossible-instruction
        description: "An instruction that is underspecified or geometrically unsatisfiable on the given part."
        expectedBehavior: "Conservative literal interpretation where possible; otherwise emits the best valid attempt with the interpretation/failure documented — never an invalid or absent output."
        edgeCase: true
      - id: degenerate-input
        description: "An input STEP that is itself non-watertight or has broken topology."
        expectedBehavior: "Detects the input defect during ANALYZE, reports it, still attempts the edit, and emits its best output without inheriting avoidable invalidity."
        edgeCase: true
    datasets:
      - id: synthetic-edit-pairs
        description: >-
          The primary dev/validation set: complexity-graded public benchmark STEPs with
          programmatically applied known edits, giving full (input, instruction, ground-truth
          output) triples scored by the local benchmark-parity scorer.
        mapsTo:
          jobs: [apply-step-edit, score-locally, build-synthetic-pairs, grade-complexity]
          scenarios: [parametric-dimension-edit, feature-add-remove, complex-multifeature-edit]
          criteria: [output-always-valid, unrelated-geometry-preserved, edit-matches-instruction, budget-and-emission-discipline, beats-same-model-baseline]
        categories:
          - id: tier-low
            description: "Low-complexity parts (prismatic, few features) with single-entity edits."
            generationGuidance: "Simple plates, brackets, cylinders; one dimension or one feature per instruction; unambiguous phrasing."
          - id: tier-mid
            description: "Mid-complexity parts with interacting features."
            generationGuidance: "Parts with patterns, blends, and multiple bodies of the same feature type; edits that neighbor but must not disturb other features."
          - id: tier-high
            description: "High-complexity parts stressing locality and re-blending."
            generationGuidance: "Dense feature interaction, curved/freeform surfaces, edits forcing boolean + blend sequences; include a slice with deliberately terse instructions."
        caseDimensions:
          complexity:
            description: "The graded geometric complexity tier of the input part."
            values: [low, mid, high]
          editType:
            description: "The kind of modification requested."
            values: [dimension-change, feature-add, feature-remove, pattern-change, boolean-combine]
          instructionStyle:
            description: "How the change request is phrased."
            values: [precise-quantitative, colloquial, terse]
        itemsRef: "datasets/synthetic-edit-pairs/manifest.yaml"
      - id: real-inputs-proxy
        description: >-
          A pre-submission check slice: the benchmark's real editing inputs (no ground truth),
          scored on validity, locality, and quantitative instruction-consistency only.
        mapsTo:
          jobs: [apply-step-edit]
          scenarios: [parametric-dimension-edit, feature-add-remove, complex-multifeature-edit, ambiguous-or-impossible-instruction, degenerate-input]
          criteria: [output-always-valid, unrelated-geometry-preserved, budget-and-emission-discipline]
        categories:
          - id: benchmark-editing-inputs
            description: "Unmodified real editing-task inputs from the public dataset."
            generationGuidance: "No generation — this slice is sampled, never synthesized; stratify the sample across graded complexity tiers."
        caseDimensions:
          complexity:
            description: "The graded complexity tier of the benchmark input."
            values: [low, mid, high]
        itemsRef: "datasets/real-inputs-proxy/manifest.yaml"
