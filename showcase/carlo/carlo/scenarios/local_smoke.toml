# Local smoke: harness-side evaluator process + a locally running CARlo server.
# EVALUATE-stage (live model calls on both sides); never run by a BUILD gate.
#
#   uv run car-bench-run scenarios/local_smoke.toml --show-logs      (from a car-bench-ijcai checkout)

[evaluator]
endpoint = "http://127.0.0.1:8081"
cmd = "python src/evaluator/server.py --host 127.0.0.1 --port 8081"

[agent_under_test]
endpoint = "http://127.0.0.1:8080"
cmd = ""  # start CARlo yourself:  GOOGLE_CLOUD_PROJECT=... bun run src/a2a/server.ts

[config]
num_trials = 1
task_split = "train"
tasks_base_num_tasks = 1
tasks_hallucination_num_tasks = 1
tasks_disambiguation_num_tasks = 1
max_steps = 50
