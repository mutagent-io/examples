<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565D6B"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B87708"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4F8F6B"/>
    </marker>
  </defs>
  <rect width="1180" height="720" fill="#FBFAF7"/>

  <text x="40" y="54" fill="#1D2129" font-size="25" font-weight="bold" letter-spacing="-0.5">CARlo</text>
  <text x="126" y="54" fill="#8A8371" font-size="13.5">an in-car voice agent</text>

  <!-- ── driver (bootstrap person-fill) ── -->
  <g transform="translate(110,230) scale(5)" fill="#565D6B"><path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/></g>
  <text x="150" y="342" fill="#1D2129" font-size="12.5" font-weight="bold" text-anchor="middle">driver</text>

  <path d="M62 128 h176 a8 8 0 0 1 8 8 v44 a8 8 0 0 1 -8 8 h-116 l-16 16 v-16 h-44 a8 8 0 0 1 -8 -8 v-44 a8 8 0 0 1 8 -8 z" fill="#FFFFFF" stroke="#DDD9CE"/>
  <text x="150" y="153" fill="#1D2129" font-size="12" font-style="italic" text-anchor="middle">&#8220;It&#8217;s getting cold</text>
  <text x="150" y="169" fill="#1D2129" font-size="12" font-style="italic" text-anchor="middle">back here&#8230;&#8221;</text>

  <path d="M62 480 h176 a8 8 0 0 1 8 8 v58 a8 8 0 0 1 -8 8 h-44 v16 l-16 -16 h-116 a8 8 0 0 1 -8 -8 v-58 a8 8 0 0 1 8 -8 z" fill="#FDF6E8" stroke="#B87708"/>
  <text x="150" y="505" fill="#8A5A06" font-size="12" font-style="italic" text-anchor="middle">&#8220;Done. Warming the</text>
  <text x="150" y="521" fill="#8A5A06" font-size="12" font-style="italic" text-anchor="middle">rear left seat area to 22</text>
  <text x="150" y="537" fill="#8A5A06" font-size="12" font-style="italic" text-anchor="middle">degrees. Anything else?&#8221;</text>

  <!-- driver ↔ agent -->
  <line x1="248" y1="180" x2="336" y2="180" stroke="#565D6B" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="292" y="171" fill="#8A8371" font-size="10.5" text-anchor="middle">hears</text>
  <line x1="336" y1="512" x2="254" y2="512" stroke="#B87708" stroke-width="1.5" marker-end="url(#aA)"/>
  <text x="295" y="531" fill="#B87708" font-size="10.5" text-anchor="middle">speaks</text>

  <!-- ── CARLO panel ── -->
  <rect x="346" y="96" width="470" height="576" rx="10" fill="#FFFFFF" stroke="#DDD9CE"/>
  <rect x="346" y="96" width="470" height="38" rx="10" fill="#1D2129"/>
  <text x="581" y="121" fill="#FFFFFF" font-size="14.5" font-weight="bold" text-anchor="middle" letter-spacing="1">C A R L O</text>

  <!-- 1 sees -->
  <ellipse cx="382" cy="168" rx="13" ry="8.5" fill="none" stroke="#565D6B" stroke-width="2"/>
  <circle cx="382" cy="168" r="3.5" fill="#565D6B"/>
  <text x="406" y="173" fill="#1D2129" font-size="13" font-weight="bold">sees this car&#8217;s live tools, schemas included</text>
  <rect x="370" y="186" width="422" height="98" rx="5" fill="#F7F5EF"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#565D6B">
    <text x="384" y="206">get_seats_occupancy()</text>
    <text x="384" y="223">get_temperature_inside_car()</text>
    <text x="384" y="240">set_climate_temperature(seat_zone, temperature)</text>
    <text x="384" y="257">set_seat_heating(level, seat_zone)</text>
  </g>
  <text x="384" y="276" fill="#8A8371" font-size="10.5">&#8230; 52 more &#183; a task may silently remove tools or single parameters</text>
  <text x="406" y="300" fill="#565D6B" font-size="11">+ the operator&#8217;s policy wiki &#183; the conversation so far</text>

  <!-- 2 thinks -->
  <circle cx="382" cy="336" r="10" fill="none" stroke="#B87708" stroke-width="2"/>
  <path d="M382 326 v-7 M382 346 v7 M372 336 h-7 M392 336 h7" stroke="#B87708" stroke-width="2"/>
  <text x="406" y="341" fill="#1D2129" font-size="13" font-weight="bold">thinks it through</text>
  <text x="406" y="360" fill="#565D6B" font-size="11.5" font-style="italic">&#8220;rear seats are occupied, no temperature given: warm the</text>
  <text x="406" y="375" fill="#565D6B" font-size="11.5" font-style="italic">rear left to a comfortable 22 &#176;C and tell the driver plainly&#8221;</text>
  <text x="406" y="396" fill="#8A8371" font-size="10.5">five house rules: confirm first &#183; metric units &amp; 24h times &#183; only what&#8217;s asked &#183; admit limits &#183; offer options</text>

  <!-- 3 schema gate -->
  <path d="M382 424 l12 4.5 v11 q0 11 -12 15.5 q-12 -4.5 -12 -15.5 v-11 z" fill="none" stroke="#4F8F6B" stroke-width="2"/>
  <path d="M376 438 l4.5 4.5 l8 -9" fill="none" stroke="#4F8F6B" stroke-width="2"/>
  <text x="406" y="436" fill="#1D2129" font-size="13" font-weight="bold">schema gate: every call checked against</text>
  <text x="406" y="452" fill="#1D2129" font-size="13" font-weight="bold">the live schema before anything is sent</text>

  <rect x="370" y="466" width="422" height="64" rx="5" fill="#FBF1EE"/>
  <text x="384" y="486" fill="#B3452E" font-size="13" font-weight="bold">&#10007;</text>
  <text x="400" y="486" fill="#B3452E" font-size="10.5" font-family="Consolas, Menlo, monospace">set_climate_temperature(zone="rear_left", temp=22)</text>
  <text x="400" y="504" fill="#9A6B5F" font-size="10.5">unknown arguments. this schema takes seat_zone, temperature</text>
  <text x="400" y="521" fill="#B87708" font-size="10.5" font-weight="bold">&#8618; blocked, handed back to the model: try again</text>

  <rect x="370" y="540" width="422" height="46" rx="5" fill="#EFF5F0"/>
  <text x="384" y="561" fill="#4F8F6B" font-size="13" font-weight="bold">&#10003;</text>
  <text x="400" y="561" fill="#4F8F6B" font-size="10.5" font-family="Consolas, Menlo, monospace">set_climate_temperature(seat_zone="rear_left", temperature=22)</text>
  <text x="400" y="578" fill="#8A8371" font-size="10.5">valid, dispatched to the car</text>

  <text x="370" y="614" fill="#8A8371" font-size="10.5">a call that never validates is dropped, not fired. driver hears the honest limit instead</text>

  <!-- agent ↔ car, over A2A -->
  <path d="M816 561 h30 q16 0 16 -16 v-59 q0 -16 16 -16 h16" fill="none" stroke="#4F8F6B" stroke-width="1.5" marker-end="url(#aG)"/>
  <text x="830" y="578" fill="#4F8F6B" font-size="10.5">acts</text>
  <line x1="896" y1="300" x2="820" y2="300" stroke="#565D6B" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="857" y="291" fill="#8A8371" font-size="10.5" text-anchor="middle">observes</text>
  <rect x="824" y="320" width="66" height="20" rx="10" fill="#EFECE3"/>
  <text x="857" y="334" fill="#565D6B" font-size="10" text-anchor="middle">A2A protocol</text>

  <!-- ── the car (bootstrap car-front-fill) ── -->
  <g transform="translate(966,138) scale(5.5)" fill="#565D6B"><path d="M2.52 3.515A2.5 2.5 0 0 1 4.82 2h6.362c1 0 1.904.596 2.298 1.515l.792 1.848c.075.175.21.319.38.404.5.25.855.715.965 1.262l.335 1.679q.05.242.049.49v.413c0 .814-.39 1.543-1 1.997V13.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1.338c-1.292.048-2.745.088-4 .088s-2.708-.04-4-.088V13.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1.892c-.61-.454-1-1.183-1-1.997v-.413a2.5 2.5 0 0 1 .049-.49l.335-1.68c.11-.546.465-1.012.964-1.261a.8.8 0 0 0 .381-.404l.792-1.848ZM3 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2m10 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2M6 8a1 1 0 0 0 0 2h4a1 1 0 1 0 0-2zM2.906 5.189a.51.51 0 0 0 .497.731c.91-.073 3.35-.17 4.597-.17s3.688.097 4.597.17a.51.51 0 0 0 .497-.731l-.956-1.913A.5.5 0 0 0 11.691 3H4.309a.5.5 0 0 0-.447.276L2.906 5.19Z"/></g>
  <text x="1010" y="242" fill="#1D2129" font-size="12.5" font-weight="bold" text-anchor="middle">car software interface &#183; 56 tools</text>

  <rect x="898" y="262" width="242" height="130" rx="5" fill="#FFFFFF" stroke="#DDD9CE"/>
  <text x="912" y="284" fill="#8A8371" font-size="10" letter-spacing="1.5">GET &#183; READ THE CAR</text>
  <g font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#565D6B">
    <text x="912" y="302">get_climate_settings()</text>
    <text x="912" y="318">get_routes(&#8230;)</text>
    <text x="912" y="334">get_charging_specs(&#8230;)</text>
  </g>
  <text x="912" y="352" fill="#8A8371" font-size="10">state &#183; databases &#183; context</text>
  <text x="912" y="380" fill="#8A8371" font-size="10.5">&#8230; readable, never guessable</text>

  <rect x="898" y="406" width="242" height="130" rx="5" fill="#FFFFFF" stroke="#DDD9CE"/>
  <text x="912" y="428" fill="#8A8371" font-size="10" letter-spacing="1.5">SET &#183; CHANGE THE CAR</text>
  <g font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#565D6B">
    <text x="912" y="446">set_fan_speed(level)</text>
    <text x="912" y="462">open_close_window(&#8230;)</text>
    <text x="912" y="478">add_waypoint(&#8230;)</text>
  </g>
  <text x="912" y="496" fill="#8A8371" font-size="10">every change is scored</text>
  <text x="912" y="524" fill="#8A8371" font-size="10.5">&#8230; each one behind the gate</text>
</svg>
